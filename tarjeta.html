<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Siempre por https: sin él el móvil no deja usar la cámara para fichar los QR -->
<script>if (location.protocol === "http:" && location.hostname === "runclub.noviciado.com") location.replace("https://" + location.host + location.pathname + location.search + location.hash);</script>
<meta name="theme-color" content="#0b0b0c">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="img/icon-192.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<meta name="robots" content="noindex">
<!-- En el iPhone, "Añadir a pantalla de inicio" la abre como una app, a pantalla completa -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Run Club">
<title>Mi tarjeta · Noviciado Run Club</title>

<link rel="stylesheet" href="css/site.css?v=202611061449">
<style>
  .card-page { max-width: 460px; margin: 0 auto; padding: max(24px, env(safe-area-inset-top)) 16px 40px; display: grid; gap: 18px; }
  .card-page header { display: flex; justify-content: space-between; align-items: center; }
  .card-page header a { color: var(--muted); font-size: 12px; letter-spacing: .22em; text-transform: uppercase; text-decoration: none; }
  .card-actions { display: grid; gap: 10px; }
  .howto { color: var(--muted); font-size: 14px; line-height: 1.6; padding: 16px 18px; border-radius: 18px; border: 1px solid var(--line); background: var(--surface); margin: 0; }
  .howto b { color: var(--text); font-weight: 500; }
  .card-error { text-align: center; padding: 60px 10px; color: var(--muted); }
  .card-error h1 { font-family: var(--serif); font-weight: 400; color: var(--text); }
</style>
</head>

<main class="card-page">
  <header>
    <div class="brand"><div class="brand-mark" aria-hidden="true">N</div><span class="brand-name">Run Club</span></div>
    <a href="./" data-i18n="cardpage.site">Web del club</a>
  </header>
  <div id="card-root"><p class="note" style="padding:60px 0" data-i18n="cardpage.loading">Cargando tu tarjeta…</p></div>
</main>
