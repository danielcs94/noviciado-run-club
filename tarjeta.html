<style>
  .card-page { max-width: 460px; margin: 0 auto; padding: max(24px, env(safe-area-inset-top)) 16px 40px; display: grid; gap: 18px; }
  .card-page header { display: flex; justify-content: space-between; align-items: center; }
  .card-page header a { color: var(--muted); font-size: 12px; letter-spacing: .22em; text-transform: uppercase; text-decoration: none; }
  .member-card { border-radius: 26px; padding: 24px; display: grid; gap: 22px; }
  .member-card .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .member-card .eyebrow { color: var(--gold); font-size: 10px; }
  .member-card h1 { font-family: var(--serif); font-size: 32px; font-weight: 600; margin: 8px 0 0; line-height: 1.05; }
  .qr { background: #f4efe6; border-radius: 18px; padding: 14px; width: min(240px, 70%); justify-self: center; aspect-ratio: 1; display: grid; place-items: center; }
  .qr svg { width: 100%; height: 100%; display: block; }
  .member-card code { display: block; text-align: center; font-family: var(--serif); font-size: 24px; letter-spacing: .16em; color: var(--gold-hi); margin-top: -8px; }
  .progress { display: grid; gap: 8px; }
  .progress header { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }
  .progress header b { color: var(--text); font-weight: 500; }
  .card-actions { display: grid; gap: 10px; }
  .howto { color: var(--muted); font-size: 14px; line-height: 1.6; padding: 16px 18px; border-radius: 18px; border: 1px solid var(--line); background: var(--surface); margin: 0; }
  .howto b { color: var(--text); font-weight: 500; }
  .card-error { text-align: center; padding: 60px 10px; color: var(--muted); }
  .card-error h1 { font-family: var(--serif); font-weight: 400; color: var(--text); }
</style>
</head>
<body>
<main class="card-page">
  <header>
    <div class="brand"><div class="brand-mark" aria-hidden="true">N</div><span class="brand-name">Run Club</span></div>
    <a href="./">Web del club</a>
  </header>
  <div id="card-root"><p class="note" style="padding:60px 0">Cargando tu tarjeta…</p></div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js" integrity="sha384-mZT2gIty7ZDdOGkxfP6joZcYdMW1Jvj9dRlfpTmaJAKKXTqzygtB22k7FLe+KZC1" crossorigin="anonymous"></script>
